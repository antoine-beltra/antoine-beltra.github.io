<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>OG Image - Antoine Beltra</title>

    <style>
        @font-face {
            font-family: "OpenDyslexic";
            src: url("https://cdn.jsdelivr.net/gh/madjeek-web/open-dyslexic@main/OpenDyslexic-2025/opendyslexic-bold-webfont.woff2")
                 format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #1a1a1a;
            font-family: "OpenDyslexic", Arial, sans-serif;
        }

        .og-image {
            width: 1200px;
            height: 630px;
            padding: 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
            color: #fff;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .og-name {
            margin-bottom: 12px;
            color: #FFFFFF;
            font-size: 68px;
            font-weight: 700;
            line-height: 1.2;
        }

        .og-job {
            margin-bottom: 40px;
            color: #808080;
            font-size: 34px;
            font-weight: 700;
            line-height: 1.2;
        }

        .og-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 48px;
            flex-wrap: nowrap;
            font-size: 28px;
            font-weight: 700;
            color: #FFA31A;
        }
    </style>
</head>
<body>
    <main class="og-image">
        <div class="og-name">Antoine Beltra</div>
        <div class="og-job">retired sailor</div>

        <div class="og-links" translate="no">
            <span>MAIL</span>
            <span>SMS</span>
            <span>QR</span>
        </div>
    </main>
</body>
</html>
