<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OG Image - Antoine Beltra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/gh/madjeek-web/open-dyslexic@main/OpenDyslexic-2025/opendyslexic-bold-webfont.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'OpenDyslexic', Arial, sans-serif;
        }

        /* La zone exacte de l'image OG */
        .og-image {
            width: 1200px;
            height: 630px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            letter-spacing: 0.05em;
            padding: 40px;
        }

        .og-name {
            color: #1DA1F2;
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .og-job {
            color: #1DA1F2;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        .og-tagline {
            color: #1DA1F2;
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 50px;
            line-height: 1.2;
        }

        .og-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .og-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 52px;
        }

        .og-btn-mail {
            background-color: #1DA1F2;
        }

        .og-btn-whatsapp {
            background-color: #25D366;
        }

        .og-btn-telegram {
            background-color: #229ED9;
        }
    </style>
</head>
<body>
    <div class="og-image">
        <div class="og-name">Antoine Beltra</div>
        <div class="og-job">retired sailor</div>
        <div class="og-tagline">Là-bas si j'y suis</div>
        <div class="og-icons">
            <div class="og-btn og-btn-mail">
                <i class="fas fa-envelope"></i>
            </div>
            <div class="og-btn og-btn-whatsapp">
                <i class="fab fa-whatsapp"></i>
            </div>
            <div class="og-btn og-btn-telegram">
                <i class="fab fa-telegram"></i>
            </div>
        </div>
    </div>
</body>
</html>
